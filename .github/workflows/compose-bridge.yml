name: Compose Bridge

on:
  push:
    branches: [poc/generated-compose-bridge, compose-generation-audit]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-generated-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Install Android build tools
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Audit pinned Compose and verify compiler-approved bindings
        run: |
          node tools/compose-codegen/pipeline.mjs --check
          node tools/compose-codegen/tests/verify.mjs audit \
            tools/compose-codegen/build/generated/ksp/debug/resources/compose-api-manifest.json \
            tools/compose-codegen/build/compose-binary-inventory.json
      - name: Detect lost public call forms
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:tools/compose-codegen/api-surface.json" 2>/dev/null; then
            previous=$(mktemp)
            git show "$BASE_SHA:tools/compose-codegen/api-surface.json" > "$previous"
            node tools/compose-codegen/tests/verify.mjs surface "$previous" tools/compose-codegen/api-surface.json
          fi
      - name: Compare coverage after upgrading Material 3
        run: |
          manifest=tools/compose-codegen/build/generated/ksp/debug/resources/compose-api-manifest.json
          pinned=$(mktemp)
          cp "$manifest" "$pinned"
          COMPOSE_GENERATED_OUTPUT="$(mktemp -d)" node tools/compose-codegen/pipeline.mjs -PcomposeMaterial3Version=1.5.0-alpha01
          node tools/compose-codegen/tests/verify.mjs upgrade "$pinned" "$manifest"
      - name: Discover and compile fixture overloads with no manual catalog
        run: |
          probe=tools/compose-codegen/src/debug/kotlin/DiscoveryProbe.kt
          mkdir -p "$(dirname "$probe")"
          trap 'rm -f "$probe"' EXIT
          cp tools/compose-codegen/tests/DiscoveryProbe.kt "$probe"
          export COMPOSE_GENERATED_OUTPUT="$(mktemp -d)"
          node tools/compose-codegen/pipeline.mjs \
            -PcomposePackages=com.jetpackcomposereactnative.codegen \
            -PmodifierPackages=com.jetpackcomposereactnative.codegen
          node tools/compose-codegen/tests/verify.mjs probe \
            tools/compose-codegen/build/generated/ksp/debug/resources/compose-api-manifest.json \
            "$COMPOSE_GENERATED_OUTPUT"
      - name: Build the library and the Fabric example
        run: |
          npm ci
          npm run build
          npm exec -- tsc -p example/tsconfig.json
          example/android/gradlew -p example/android :app:assembleRelease -PreactNativeArchitectures=x86_64
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify rendering, updates and JavaScript events on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install example/android/app/build/outputs/apk/release/app-release.apk
            python3 scripts/check-emulator.py --preview-dir compose-gallery || { adb logcat -d > compose-emulator.log; adb exec-out screencap -p > compose-emulator.png; adb pull /sdcard/compose-bridge.xml compose-emulator.xml || true; exit 1; }
      - name: Save the verified Android APK
        uses: actions/upload-artifact@v4
        with:
          name: compose-bridge-android-x86_64
          path: example/android/app/build/outputs/apk/release/app-release.apk
      - name: Save gallery previews
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-gallery-previews
          path: compose-gallery
          if-no-files-found: ignore
      - name: Save emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-emulator-log
          path: compose-emulator.*
