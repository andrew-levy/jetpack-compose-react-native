name: Compose Bridge

on:
  push:
    branches: [codex/expressive-verification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-generated-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Install Android build tools
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Verify sources generated from AndroidX Compose
        run: |
          gradle -p tools/compose-codegen kspDebugKotlin
          node tools/compose-codegen/generate.mjs
      - name: Save generated sources
        uses: actions/upload-artifact@v4
        with:
          name: expressive-generated-sources
          path: |
            src/generated/*.ts
            src/generated/*.tsx
            android/src/main/java/com/jetpackcomposereactnative/generated/*Registry.kt
            android/src/main/java/com/jetpackcomposereactnative/generated/ComposeValues.kt
      - name: Build the library and the Fabric example
        run: |
          npm ci
          npm run build
          npm exec -- tsc -p example/tsconfig.json
          example/android/gradlew -p example/android :app:assembleRelease -PreactNativeArchitectures=x86_64
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify rendering, updates and JavaScript events on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install example/android/app/build/outputs/apk/release/app-release.apk
            python3 scripts/check-emulator.py --preview-dir compose-gallery || { adb logcat -d > compose-emulator.log; adb exec-out screencap -p > compose-emulator.png; adb pull /sdcard/compose-bridge.xml compose-emulator.xml || true; exit 1; }
      - name: Save the verified Android APK
        uses: actions/upload-artifact@v4
        with:
          name: compose-bridge-android-x86_64
          path: example/android/app/build/outputs/apk/release/app-release.apk
      - name: Save gallery previews
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-gallery-previews
          path: compose-gallery/*.png
          if-no-files-found: ignore
      - name: Save emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-emulator-log
          path: compose-emulator.*
