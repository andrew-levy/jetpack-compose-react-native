name: Record Fieldnote Android walkthrough

on:
  push:
    branches: [recording/fieldnote-walkthrough]

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Fieldnote APK
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
          npm ci
          npm run example:prebuild -- --no-install
          sed -i 's|// extraPackagerArgs = \[\]|extraPackagerArgs = ["--max-workers", "2"]|' example/android/app/build.gradle
          ./example/android/gradlew -p example/android :app:packageRelease -PreactNativeArchitectures=x86_64 -Pandroid.enableMinifyInReleaseBuilds=false -Pandroid.enableShrinkResourcesInReleaseBuilds=false --max-workers=2
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-fieldnote-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record native Android interactions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 720x1600
            adb shell wm density 280
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb install -r example/android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.jetpackcomposereactnative.example/.MainActivity
            JPC_ADB="$(command -v adb)" python -u scripts/record-fieldnote-walkthrough.py
      - name: Upload Android footage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fieldnote-android-walkthrough
          path: |
            scripts/0*.mp4
            scripts/0*.log
            scripts/*welcome.png
            scripts/failure.png
          if-no-files-found: warn
