name: Compose Generated PoC
on:
  push:
    branches: [poc/generated-compose-bridge]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-generated-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify generated outputs
        run: node poc/generated-bridge/generate.mjs --check
      - name: Compile generated dispatcher against real Compose dependencies
        run: gradle -p poc/generated-bridge/android-smoke compileDebugKotlin --stacktrace --no-daemon
