name: Compose Generated PoC
on:
  push:
    branches: [poc/generated-compose-bridge]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-generated-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify generated outputs
        run: node poc/generated-bridge/generate.mjs --check
      - name: Compile generated dispatcher against real Compose dependencies
        run: gradle -p poc/generated-bridge/android-smoke compileDebugKotlin compileDebugAndroidTestKotlin --stacktrace --no-daemon
  emulator-compose-render:
    needs: compile-generated-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Exercise nested generated Compose rendering on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle -p poc/generated-bridge/android-smoke connectedDebugAndroidTest --stacktrace --no-daemon
