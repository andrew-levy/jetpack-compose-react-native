android.useAndroidX=true
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Compile generated Compose dispatch in the same heap as Gradle.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
# AGP 9 defaults to built-in Kotlin and the new DSL. This project applies the Kotlin Android plugin,
# as React Native and Expo projects do.
android.builtInKotlin=false
android.newDsl=false
