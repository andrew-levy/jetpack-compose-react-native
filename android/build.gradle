apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def sdkVersion = { key, fallback -> rootProject.ext.has(key) ? rootProject.ext.get(key) : fallback }

android {
    namespace "com.jetpackcomposereactnative"
    compileSdk sdkVersion("compileSdkVersion", 34)

    defaultConfig {
        minSdk sdkVersion("minSdkVersion", 23)
    }

    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation platform("androidx.compose:compose-bom:2024.09.03")
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material"
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.material3.adaptive:adaptive"
    implementation "androidx.compose.ui:ui-tooling-preview-android:1.7.6"
    implementation "org.jetbrains.kotlin:kotlin-reflect:1.9.24"
    implementation "io.coil-kt.coil3:coil:3.0.2"
    implementation "io.coil-kt.coil3:coil-network-okhttp:3.0.2"
    implementation "io.coil-kt.coil3:coil-svg:3.0.2"
    implementation "io.coil-kt.coil3:coil-compose:3.0.2"
}
