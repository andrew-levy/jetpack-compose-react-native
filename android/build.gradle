apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: "com.facebook.react"

def sdkVersion = { key, fallback -> rootProject.ext.has(key) ? rootProject.ext.get(key) : fallback }

android {
    namespace "com.jetpackcomposereactnative"
    compileSdk sdkVersion("compileSdkVersion", 37)
    // Compose UI and Foundation 1.13 are compiled against Android API 37.1.
    compileSdkMinor sdkVersion("compileSdkMinorVersion", 1)

    defaultConfig {
        minSdk sdkVersion("minSdkVersion", 24)
        // Material icons are looked up by name, so release builds keep their getters.
        consumerProguardFiles "consumer-rules.pro"
    }

    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "androidx.compose.foundation:foundation:1.13.0"
    implementation "androidx.compose.material:material-icons-core:1.7.8"
    implementation "androidx.compose.material:material-icons-extended:1.7.8"
    implementation "androidx.compose.material3:material3:1.5.0"
    implementation "androidx.compose.material3:material3-adaptive-navigation-suite:1.5.0"
    implementation "androidx.compose.material3.adaptive:adaptive-layout:1.3.0"
    implementation "androidx.compose.material3.adaptive:adaptive-navigation:1.3.0"
}
